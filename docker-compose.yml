services:
  tirotime-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tirotime-app
    restart: always
    env_file:
      - .env
    ports:
      # Host-Port 5000 -> Container-Port 8080 (die App läuft im Container ohne Root-Rechte)
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Aus .env (nicht im Repository):
      #   ConnectionStrings__DefaultConnection  (Server=host.docker.internal;Database=TiroTime;...)
      #   ReportsApi__ApiKey                    (Pflicht für /api/reports/*)
      #   TimeLoggingApi__ApiKey                (optional für POST /api/time-entries)
      #   JWT_SECRET, MAILJET_*                 (siehe unten)
      - Jwt__Secret=${JWT_SECRET:?JWT_SECRET muss in .env gesetzt sein (mindestens 32 Zeichen)}
      - Jwt__Issuer=TiroTime
      - Jwt__Audience=TiroTime
      - Mailjet__ApiKey=${MAILJET_API_KEY}
      - Mailjet__ApiSecret=${MAILJET_API_SECRET}
      - Mailjet__FromEmail=${MAILJET_FROM_EMAIL}
      - Mailjet__FromName=TiroTime
    volumes:
      # Data-Protection-Keys persistieren, damit Anmelde-Cookies ein Neu-Deployment überleben
      - tirotime-dataprotection:/home/app/.aspnet/DataProtection-Keys
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tirotime-network

volumes:
  tirotime-dataprotection:

networks:
  tirotime-network:
    driver: bridge
